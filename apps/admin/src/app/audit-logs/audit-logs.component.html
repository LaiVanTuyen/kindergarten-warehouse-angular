<div class="h-full flex flex-col">

    <!-- Detached Dark Banner -->
    <div
        class="bg-slate-800 p-5 rounded-3xl text-white shadow-xl mb-4 flex justify-between items-center relative overflow-hidden">
        <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/5 rounded-full blur-3xl pointer-events-none"></div>

        <div class="flex flex-col gap-1">
            <app-breadcrumb></app-breadcrumb>
            <h1 class="text-2xl font-bold tracking-tight">Audit Logs</h1>
            <p class="text-slate-400 mt-1 text-sm">Track system activities and ensure security.</p>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="flex flex-col xl:flex-row justify-between items-center gap-4 mb-4">
        <!-- Filters -->
        <div class="flex items-center gap-3 w-full xl:w-auto">
            <div class="relative w-full sm:w-56">
                <select [formControl]="actionControl"
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 appearance-none cursor-pointer">
                    <option value="ALL">All Actions</option>
                    <option value="CREATE">Create</option>
                    <option value="UPDATE">Update</option>
                    <option value="DELETE">Delete</option>
                    <option value="LOGIN">Login</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </div>
            </div>

            <!-- Reset Button -->
            <button (click)="resetFilters()" title="Reset Filters"
                class="px-3 py-2.5 border border-gray-200 rounded-xl text-gray-500 bg-white hover:bg-gray-50 hover:text-gray-700 transition-colors shadow-sm active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>

        <!-- Search -->
        <div class="relative w-full sm:w-72">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20"
                    fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                        clip-rule="evenodd" />
                </svg>
            </div>
            <input [formControl]="searchControl" type="text" placeholder="Search logs..."
                class="block w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-white transition-all shadow-sm" />
        </div>
    </div>

    <!-- Table -->
    <div class="flex-1 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden flex flex-col">

        <!-- Skeleton Loading -->
        <div *ngIf="isLoading()" class="p-6">
            <app-skeleton-table [rows]="10" [cols]="5" [template]="['text-sm', 'text', 'badge', 'text', 'text']">
            </app-skeleton-table>
        </div>

        <div *ngIf="!isLoading()" class="overflow-auto flex-1">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 sticky top-0 z-10">
                    <tr>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-40">Time</th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-40">Performer
                        </th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-32">Action</th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-40">Object</th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Details</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr *ngFor="let log of paginatedLogs()" class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 text-sm text-slate-500 whitespace-nowrap font-mono">
                            {{ log.timestamp | date:'short' }}
                        </td>
                        <td class="px-6 py-4">
                            <div class="font-bold text-slate-700">{{ log.username }}</div>
                        </td>
                        <td class="px-6 py-4">
                            <span
                                class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold ring-1 ring-inset"
                                [ngClass]="{
                  'bg-emerald-50 text-emerald-700 ring-emerald-600/20': log.action === 'CREATE',
                  'bg-amber-50 text-amber-700 ring-amber-600/20': log.action === 'UPDATE',
                  'bg-rose-50 text-rose-700 ring-rose-600/20': log.action === 'DELETE',
                  'bg-blue-50 text-blue-700 ring-blue-600/20': log.action === 'LOGIN'
                }">
                                {{ log.action }}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm text-slate-600 font-medium">
                            {{ log.target }}
                        </td>
                        <td class="px-6 py-4 text-sm text-slate-500">
                            {{ log.detail }}
                        </td>
                    </tr>

                    <!-- Empty State -->
                    <tr *ngIf="paginatedLogs().length === 0">
                        <td colspan="5" class="p-0">
                            <div class="p-8">
                                <app-empty-state message="No audit logs found"
                                    subMessage="We couldn't find any activities matching your filters.">
                                </app-empty-state>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div *ngIf="!isLoading()" class="border-t border-slate-100 bg-white p-4">
            <app-pagination [currentPage]="currentPage()" [pageSize]="pageSize()" [totalItems]="totalLogs()"
                (pageChange)="onPageChange($event)"></app-pagination>
        </div>
    </div>
</div>
