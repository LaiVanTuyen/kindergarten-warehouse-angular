<div class="flex h-screen bg-gray-100">

  <!-- Mobile Sidebar Overlay -->
  <div *ngIf="isSidebarOpen()" (click)="isSidebarOpen.set(false)"
    class="fixed inset-0 bg-gray-900/50 z-20 lg:hidden backdrop-blur-sm transition-opacity">
  </div>

  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-30 w-64 bg-white transform transition-transform duration-300 ease-in-out lg:translate-x-0 lg:static lg:inset-0 shadow-xl lg:shadow-none"
    [ngClass]="isSidebarOpen() ? 'translate-x-0' : '-translate-x-full'">
    <app-sidebar class="h-full"></app-sidebar>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden w-full">
    <!-- Topbar -->
    <header class="bg-white shadow-sm h-16 flex items-center justify-between px-4 lg:px-6 z-10 relative">

      <div class="flex items-center gap-3">
        <!-- Mobile Toggle Button -->
        <button (click)="toggleSidebar()" class="p-2 -ml-2 mr-2 text-gray-600 hover:bg-gray-100 rounded-lg lg:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <h2 class="text-lg lg:text-xl font-semibold text-gray-800 truncate">
          Administrator Panel
        </h2>
      </div>

      <div class="flex items-center space-x-4 relative">
        <span class="text-sm text-gray-500 hidden sm:block">Welcome, Admin</span>

        <!-- Avatar Button -->
        <button (click)="toggleProfile()"
          class="w-8 h-8 rounded-full bg-admin-navy text-white flex items-center justify-center font-bold hover:opacity-80 transition-opacity cursor-pointer focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          A
        </button>

        <!-- Profile Popup -->
        <div *ngIf="isProfileOpen()"
          class="absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50 transform transition-all duration-200 origin-top-right">
          <!-- User Info Header -->
          <div class="px-4 py-3 border-b border-gray-100">
            <p class="text-sm font-medium text-gray-900">Admin User</p>
            <p class="text-xs text-gray-500 truncate">admin@example.com</p>
          </div>

          <!-- Menu Items -->
          <a routerLink="/profile"
            class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2"
            (click)="isProfileOpen.set(false)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            My Profile
          </a>

          <button (click)="logout()"
            class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Logout
            </b4utton>
        </div>
      </div>
    </header>
    <!-- Content Area -->
    <main class="flex-1 overflow-hidden bg-gray-100 p-4 lg:p-6 relative flex flex-col">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
