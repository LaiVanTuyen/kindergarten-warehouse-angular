<div class="px-6 py-4 border-t border-line flex justify-end items-center bg-surface-2/50">
    <div class="flex gap-2">
        <button [disabled]="currentPage() === 1" (click)="onPageChange(currentPage() - 1)"
            class="px-3 py-1.5 border border-line rounded-lg text-sm bg-surface hover:bg-surface-2 disabled:opacity-50 transition-colors">‹ Trước</button>

        <ng-container *ngFor="let page of pages(); trackBy: trackByIndex">
            <button *ngIf="page !== '...'" (click)="onPageClick(page)"
                class="px-3 py-1.5 border rounded-lg text-sm font-medium transition-colors"
                [ngClass]="currentPage() === page ? 'bg-slate-800 text-white border-slate-800' : 'bg-surface border-line text-ink-soft hover:bg-surface-2'">
                {{ page }}
            </button>
            <span *ngIf="page === '...'" class="px-3 py-1.5 text-ink-muted font-bold select-none">
                ...
            </span>
        </ng-container>

        <button [disabled]="currentPage() >= totalPages()" (click)="onPageChange(currentPage() + 1)"
            class="px-3 py-1.5 border border-line rounded-lg text-sm bg-surface hover:bg-surface-2 disabled:opacity-50 transition-colors">Sau ›</button>
    </div>
</div>
