<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-col lg:flex-row gap-8">

        <!-- LEFT COLUMN: IDENTIFIER (30%) -->
        <div class="lg:w-[30%] space-y-6">
            <div
                class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col items-center text-center">

                <!-- Hidden File Input -->
                <input type="file" #fileInput class="hidden" (change)="onFileSelected($event)" accept="image/*">

                <!-- Avatar Section -->
                <div class="relative group cursor-pointer" (click)="fileInput.click()">
                    <img [src]="user.avatarUrl || 'https://ui-avatars.com/api/?name=' + user.name + '&background=random'"
                        alt="Profile Avatar"
                        class="w-32 h-32 rounded-full object-cover border-4 border-white shadow-lg ring-1 ring-gray-100 transition-transform group-hover:scale-105">

                    <!-- Camera Upload Button -->
                    <button
                        class="absolute bottom-0 right-0 p-2 bg-white rounded-full shadow-md border border-gray-100 text-gray-400 hover:text-blue-600 hover:border-blue-100 transition-all"
                        title="Change Avatar">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>

                <!-- Identity -->
                <h2 class="mt-4 text-xl font-bold text-gray-900">{{ user.name }}</h2>
                <div class="mt-2 flex flex-wrap justify-center gap-2">
                    <span *ngFor="let role of user.role.split(', ')"
                        class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700">
                        {{ role }}
                    </span>
                </div>

                <p class="mt-4 text-sm text-gray-400">
                    Joined: {{ user.joinedDate | date:'mediumDate' }}
                </p>

            </div>
        </div>

        <!-- RIGHT COLUMN: CONFIGURATION (70%) -->
        <div class="lg:w-[70%] bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">

            <!-- Tabs -->
            <div class="border-b border-gray-100 flex">
                <button (click)="activeTab = 'general'" [class.text-blue-600]="activeTab === 'general'"
                    [class.border-blue-600]="activeTab === 'general'" [class.font-semibold]="activeTab === 'general'"
                    class="flex-1 py-4 text-sm font-medium text-center border-b-2 border-transparent hover:text-blue-500 transition-colors">
                    General Information
                </button>
                <button (click)="activeTab = 'security'" [class.text-blue-600]="activeTab === 'security'"
                    [class.border-blue-600]="activeTab === 'security'" [class.font-semibold]="activeTab === 'security'"
                    class="flex-1 py-4 text-sm font-medium text-center border-b-2 border-transparent hover:text-blue-500 transition-colors">
                    Security & Password
                </button>
            </div>

            <!-- Content Area -->
            <div class="p-8">

                <!-- GENRAL TAB -->
                <div *ngIf="activeTab === 'general'" class="animate-fade-in">
                    <h3 class="text-lg font-semibold text-gray-800 mb-6">Profile Settings</h3>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Full Name -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                            <input type="text" [(ngModel)]="user.name"
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all">
                        </div>

                        <!-- Phone -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
                            <input type="tel" [(ngModel)]="user.phone"
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all">
                        </div>

                        <!-- Bio -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Bio</label>
                            <textarea rows="4" [(ngModel)]="user.bio"
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
                            <p class="mt-2 text-xs text-gray-400 text-right">0/500 characters</p>
                        </div>
                    </div>

                    <!-- Save Button Area -->
                    <div class="mt-8 flex justify-end border-t border-gray-50 pt-6">
                        <button (click)="saveProfile()" [disabled]="!hasChanges"
                            class="px-6 py-2.5 bg-gray-900 text-white font-medium rounded-xl hover:bg-gray-800 active:scale-95 transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100">
                            Save Changes
                        </button>
                    </div>
                </div>

                <!-- SECURITY TAB -->
                <div *ngIf="activeTab === 'security'" class="animate-fade-in">
                    <h3 class="text-lg font-semibold text-gray-800 mb-6">Change Password</h3>
                    <p class="text-sm text-gray-500 mb-6">Ensure your account is using a long, random password to stay
                        secure.</p>

                    <div class="space-y-5 max-w-lg">
                        <!-- Current Password -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Current Password</label>
                            <input type="password" [(ngModel)]="currentPassword" placeholder="••••••••"
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all">
                        </div>

                        <!-- New Password -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
                            <input type="password" [(ngModel)]="newPassword" placeholder="Min 8 characters..."
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all">
                        </div>

                        <!-- Confirm Password -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Confirm New Password</label>
                            <input type="password" [(ngModel)]="confirmPassword" placeholder="Min 8 characters..."
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all"
                                [class.border-red-500]="!passwordsMatch" [class.focus:ring-red-100]="!passwordsMatch">

                            <p *ngIf="!passwordsMatch" class="mt-1 text-sm text-red-500 font-medium">
                                Passwords do not match!
                            </p>
                        </div>
                    </div>
                    <!-- Update Button Area -->
                    <div class="mt-8 flex justify-end border-t border-gray-50 pt-6">
                        <button (click)="updatePassword()" [disabled]="!isPasswordValid"
                            class="px-6 py-2.5 bg-blue-600 text-white font-medium rounded-xl hover:bg-blue-700 active:scale-95 transition-all shadow-blue-200 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none disabled:active:scale-100">
                            Update Password
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
