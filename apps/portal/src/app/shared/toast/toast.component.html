<div class="fixed top-24 right-4 z-50 space-y-4 pointer-events-none">
    <div *ngFor="let toast of toastService.toasts$ | async"
        class="pointer-events-auto transform transition-all duration-300 ease-in-out hover:scale-105" [ngClass]="{
         'animate-fade-in-up': true,
         'bg-green-50 text-green-800 border-green-200': toast.type === 'success',
         'bg-red-50 text-red-800 border-red-200': toast.type === 'error',
         'bg-blue-50 text-blue-800 border-blue-200': toast.type === 'info'
       }" class="flex items-center p-4 min-w-[300px] border rounded-2xl shadow-lg backdrop-blur-sm bg-opacity-95">

        <!-- Icon -->
        <div class="flex-shrink-0 mr-3">
            <i *ngIf="toast.type === 'success'" class="ph ph-check-circle text-2xl text-green-500"></i>
            <i *ngIf="toast.type === 'error'" class="ph ph-warning-circle text-2xl text-red-500"></i>
            <i *ngIf="toast.type === 'info'" class="ph ph-info text-2xl text-blue-500"></i>
        </div>

        <div class="flex-1 font-medium">{{ toast.message }}</div>

        <button (click)="toastService.remove(toast.id)" class="ml-4 opacity-50 hover:opacity-100 transition-opacity">
            <i class="ph ph-x text-lg"></i>
        </button>
    </div>
</div>
