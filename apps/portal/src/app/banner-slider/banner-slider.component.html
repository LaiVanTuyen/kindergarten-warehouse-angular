<div class="container mx-auto px-4 py-8 lg:py-12 relative cursor-grab active:cursor-grabbing select-none"
  (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()" (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)" (mousedown)="onMouseDown($event)" (mouseup)="onMouseUp($event)">
  <div *ngFor="let slide of slides; let i = index" [class.hidden]="i !== activeSlideIndex"
    class="bg-gradient-to-r {{ slide.bgFrom }} {{ slide.bgTo }} rounded-[2.5rem] p-8 lg:p-12 flex flex-col md:flex-row items-center gap-8 shadow-sm relative overflow-hidden transition-opacity duration-500 animate-fade-in-up min-h-[500px]">

    <!-- Text Content -->
    <div class="md:w-1/2 z-10 text-center md:text-left space-y-6">
      <h1 class="text-4xl md:text-5xl lg:text-6xl font-black text-gray-800 leading-tight drop-shadow-sm min-h-[1.2em]"
        [innerHTML]="slide.title">
      </h1>
      <p class="text-gray-600 text-lg md:text-xl font-bold max-w-lg mx-auto md:mx-0 drop-shadow-sm min-h-[5rem]"
        [innerHTML]="slide.subtitle">
      </p>
      <div class="pt-4">
        <a routerLink="/resources"
          class="inline-block px-8 py-4 bg-gradient-to-r from-primary-pink to-orange-400 text-white text-lg font-bold rounded-full shadow-lg hover:shadow-xl hover:from-pink-600 hover:to-orange-500 transition-all transform hover:-translate-y-1 animate-bounce-slow">
          <ng-content select="[viewAllBtnText]"></ng-content>
          View All
        </a>
      </div>
    </div>

    <!-- Illustration -->
    <div class="md:w-1/2 flex justify-center z-10">
      <img [src]="slide.imageUrl" alt="Banner Illustration"
        class="rounded-3xl shadow-md w-full h-[350px] lg:h-[400px] object-cover transform rotate-2 hover:rotate-0 transition-transform duration-500"
        onerror="this.src='https://img.freepik.com/free-vector/happy-children-learning-classroom_74855-5852.jpg'" />
    </div>
  </div>

  <!-- Dots Info -->
  <div class="flex justify-center mt-4 gap-2">
    <button *ngFor="let slide of slides; let i = index" (click)="activeSlideIndex = i"
      class="w-4 h-4 rounded-full transition-colors"
      [ngClass]="i === activeSlideIndex ? 'bg-primary-pink scale-125' : 'bg-gray-300'">
    </button>
  </div>
</div>
