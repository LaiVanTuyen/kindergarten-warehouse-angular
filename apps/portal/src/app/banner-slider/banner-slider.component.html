<!-- Giữ chỗ bằng đúng chiều cao banner khi đang tải, tránh đẩy nội dung bên dưới (CLS). -->
<section *ngIf="!loaded()" class="container mx-auto px-4 py-8 lg:py-12" aria-hidden="true">
  <div class="rounded-3xl bg-surface-2 animate-pulse h-[622px] md:h-[406px] lg:h-[410px]"></div>
</section>
<section *ngIf="hasSlides()"
  class="container mx-auto px-4 py-8 lg:py-12 relative cursor-grab active:cursor-grabbing select-none"
  role="region" aria-roledescription="carousel" aria-label="Khuyến nghị và thông báo"
  (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()"
  (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)"
  (mousedown)="onMouseDown($event)" (mouseup)="onMouseUp($event)">
  <div *ngFor="let slide of slides(); let i = index; trackBy: trackBySlideId"
    [style.display]="i === activeIndex() ? 'flex' : 'none'"
    [attr.aria-hidden]="i !== activeIndex()"
    [attr.aria-roledescription]="'slide'"
    [attr.aria-label]="'Slide ' + (i + 1) + ' trên ' + slides().length"
    class="rounded-3xl p-6 lg:p-8 flex flex-col md:flex-row items-center gap-6 shadow-sm relative overflow-hidden transition-opacity duration-300 min-h-[320px] bg-gradient-to-r"
    [ngClass]="[slide.bgFrom, slide.bgTo]">
    <div class="md:w-1/2 z-10 text-center md:text-left space-y-6">
      <h2 class="text-2xl md:text-3xl lg:text-4xl font-bold text-gray-800 leading-tight min-h-[1.2em]"
        [innerHTML]="slide.title"></h2>
      <p class="text-gray-600 text-base md:text-lg font-medium max-w-lg mx-auto md:mx-0"
        [innerHTML]="slide.subtitle"></p>
      <div class="pt-4">
        <a [routerLink]="slide.link || '/resources'"
          class="inline-flex items-center gap-2 px-6 py-3 bg-primary-700 text-white text-base font-semibold rounded-xl shadow-sm hover:bg-primary-800 transition-colors focus:outline-none focus-visible:ring-4 focus-visible:ring-focus">
          Khám phá tài liệu <span aria-hidden="true">→</span>
        </a>
      </div>
    </div>
    <div class="md:w-1/2 flex justify-center z-10">
      <img [src]="slide.imageUrl" alt="" role="presentation" loading="lazy" decoding="async"
        class="rounded-2xl shadow-sm w-full h-[220px] lg:h-[260px] object-cover"
        onerror="this.onerror=null;this.src='https://img.freepik.com/free-vector/happy-children-learning-classroom_74855-5852.jpg'" />
    </div>
  </div>

  <!-- Dots -->
  <div *ngIf="slides().length > 1" class="flex justify-center mt-4">
    <button type="button" (click)="autoplayPaused.set(!autoplayPaused())" [attr.aria-pressed]="autoplayPaused()"
      class="rounded-xl px-4 py-2 text-sm text-ink-soft border border-line bg-surface focus-visible:ring-2 focus-visible:ring-focus">
      {{ autoplayPaused() ? 'Tiếp tục chuyển banner' : 'Tạm dừng chuyển banner' }}
    </button>
  </div>
  <div class="flex justify-center mt-4 gap-2" role="tablist" aria-label="Chọn slide">
    <button *ngFor="let slide of slides(); let i = index; trackBy: trackBySlideId"
      type="button" role="tab"
      [attr.aria-label]="'Chuyển đến slide ' + (i + 1)"
      [attr.aria-selected]="i === activeIndex()"
      (click)="goTo(i)"
      class="rounded-full transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-focus"
      [class.w-8]="i === activeIndex()"
      [class.w-4]="i !== activeIndex()"
      [class.h-4]="true"
      [class.bg-primary]="i === activeIndex()"
      [class.bg-line-strong]="i !== activeIndex()"
      [class.hover:bg-ink-muted]="i !== activeIndex()"></button>
  </div>
</section>

<div *ngIf="!hasSlides() && error()" class="container mx-auto px-4 py-8 text-center text-sm text-ink-muted" role="alert">
  Không tải được banner. <button type="button" (click)="loadBanners()"
    class="text-primary font-semibold hover:underline">Thử lại</button>
</div>
