<div class="min-h-[calc(100vh-6rem)] bg-rose-50/40 px-4 py-12">
  <div class="mx-auto max-w-md rounded-2xl border border-white/70 bg-white p-8 shadow-xl shadow-pink-100/60">
    <a routerLink="/login" class="mb-8 inline-flex items-center gap-2 text-sm font-bold text-pink-600 hover:text-pink-700">
      <i class="ph-bold ph-arrow-left" aria-hidden="true"></i>
      Quay lại đăng nhập
    </a>

    <div class="mb-8">
      <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-pink-100 text-pink-600">
        <i class="ph-duotone ph-key text-3xl" aria-hidden="true"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-gray-950">Quên mật khẩu</h1>
      <p class="mt-2 text-sm leading-6 text-gray-600">
        Nhập email tài khoản của bạn. Hệ thống sẽ gửi hướng dẫn đặt lại mật khẩu nếu email hợp lệ.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5" novalidate>
      <div>
        <label for="forgot-email" class="mb-1.5 block text-sm font-bold text-gray-700">Email</label>
        <input
          id="forgot-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-gray-900 outline-none transition focus:border-pink-400 focus:ring-4 focus:ring-pink-100"
          [class.border-red-400]="form.controls.email.invalid && form.controls.email.touched"
        />
        <p *ngIf="form.controls.email.invalid && form.controls.email.touched" class="mt-1.5 text-sm font-medium text-red-600">
          Vui lòng nhập email hợp lệ.
        </p>
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="flex w-full items-center justify-center gap-2 rounded-full bg-gradient-to-r from-pink-500 to-fuchsia-500 px-6 py-3.5 text-base font-bold text-white shadow-lg shadow-pink-500/20 transition hover:-translate-y-0.5 hover:shadow-pink-500/30 disabled:cursor-not-allowed disabled:opacity-60">
        <svg *ngIf="isLoading()" class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        Gửi hướng dẫn
      </button>
    </form>

    <div *ngIf="submittedEmail()" class="mt-6 rounded-2xl border border-emerald-100 bg-emerald-50 px-4 py-3 text-sm font-medium text-emerald-700">
      Đã gửi yêu cầu cho {{ submittedEmail() }}.
    </div>
  </div>
</div>
