<div class="container mx-auto px-4 py-8 font-sans">
  <!-- Banner Slider -->


  <!-- Section Title & Sort -->
  <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
    <h2 class="text-2xl font-bold text-gray-800">{{ 'list.explore' | translate }}</h2>

    <div class="relative">
      <select (change)="onSortChange($event)"
        class="appearance-none bg-white border border-gray-200 text-gray-700 py-2 pl-4 pr-10 rounded-full focus:outline-none focus:ring-2 focus:ring-primary-blue focus:border-transparent cursor-pointer shadow-sm font-medium">
        <option value="newest">{{ 'sort.newest' | translate }}</option>
        <option value="name-asc">{{ 'sort.nameAsc' | translate }}</option>
        <option value="name-desc">{{ 'sort.nameDesc' | translate }}</option>
        <option value="rating-desc">{{ 'sort.ratingDesc' | translate }}</option>
        <option value="rating-asc">{{ 'sort.ratingAsc' | translate }}</option>
      </select>
      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
          <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Category Pills (Horizontal Scroll) -->
  <div id="resources" class="flex flex-wrap justify-center gap-4 mb-10">
    <!-- 'All' Pill -->
    <button (click)="onCategoryChange('')" class="px-6 py-2 rounded-full font-medium transition-all shadow-sm border"
      [ngClass]="
        (selectedCategory$ | async) === ''
          ? 'bg-gradient-to-r from-primary-pink to-primary-blue text-white border-transparent shadow-md'
          : 'bg-white text-gray-600 border-gray-200 hover:border-primary-pink hover:text-primary-pink'
      ">
      {{ 'list.all' | translate }}
    </button>

    <!-- Categories -->
    <button *ngFor="let cat of (categories$ | async)?.data" (click)="onCategoryChange(cat.id)"
      class="px-6 py-2 rounded-full font-medium transition-all shadow-sm border flex items-center gap-2" [ngClass]="
        (selectedCategory$ | async) === cat.id
          ? 'bg-gradient-to-r from-primary-pink to-primary-blue text-white border-transparent shadow-md'
          : 'bg-white text-gray-600 border-gray-200 hover:border-primary-pink hover:text-primary-pink'
      ">
      <span>{{ cat.icon }}</span>
      <span>{{ cat.name }}</span>
    </button>
  </div>

  <!-- Resource Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    <div *ngFor="let resource of resources$ | async"
      class="group bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-xl transition-all duration-300 hover:-translate-y-1 flex flex-col">
      <!-- Thumbnail (Click to Preview) -->
      <div class="aspect-w-16 aspect-h-10 bg-gray-100 relative cursor-pointer overflow-hidden"
        (click)="openPreview(resource)" (keydown.enter)="openPreview(resource)" tabindex="0">
        <img *ngIf="resource.thumbnail" [src]="resource.thumbnail"
          class="w-full h-48 object-cover transition-transform duration-500 group-hover:scale-105" alt="thumbnail" />
        <div *ngIf="!resource.thumbnail" class="w-full h-48 flex items-center justify-center text-4xl bg-gray-50">
          <span *ngIf="resource.type === 'PDF'">📄</span>
          <span *ngIf="resource.type === 'VIDEO'">🎬</span>
          <span *ngIf="resource.type === 'EXCEL'">📊</span>
          <span *ngIf="resource.type === 'WORD'">📝</span>
        </div>

        <!-- Status Dot (Design Match) -->
        <div class="absolute top-3 right-3">
          <div class="w-3 h-3 rounded-full bg-white shadow-md"></div>
        </div>
      </div>

      <!-- Content -->
      <div class="p-5 flex-1 flex flex-col">
        <h3
          class="font-bold text-gray-800 text-lg mb-1 line-clamp-1 cursor-pointer hover:text-primary-blue transition-colors"
          (click)="openPreview(resource)" (keydown.enter)="openPreview(resource)" tabindex="0">
          {{ resource.title }}
        </h3>
        <p class="text-sm text-gray-500 mb-4 line-clamp-2 flex-1">
          {{
          resource.description ||
          'No description available for this resource.'
          }}
        </p>

        <!-- Rating Stars -->
        <div class="flex items-center text-yellow-400 mb-3" *ngIf="resource.rating">
          <span class="font-bold text-gray-700 text-xs mr-1">{{ resource.rating }}</span>
          <svg *ngFor="let star of [1,2,3,4,5]" xmlns="http://www.w3.org/2000/svg" class="h-3 w-3"
            [class.text-gray-200]="star > resource.rating" viewBox="0 0 20 20" fill="currentColor">
            <path
              d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
          </svg>
        </div>

        <!-- Footer: Views & Download -->
        <div class="flex justify-between items-center mt-auto pt-4 border-t border-gray-50">
          <div class="flex items-center text-gray-400 text-xs font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            {{ resource.viewsCount }} {{ 'list.views' | translate }}
          </div>

          <div class="flex gap-2">
            <button (click)="openPreview(resource); $event.stopPropagation()"
              class="px-4 py-1.5 rounded-full border border-primary-blue text-primary-blue text-xs font-bold shadow-sm hover:bg-blue-50 transition-all">
              {{ 'list.view' | translate }}
            </button>
            <button (click)="downloadResource($event, resource)"
              class="px-4 py-1.5 rounded-full bg-gradient-to-r from-primary-pink to-primary-blue text-white text-xs font-bold shadow-sm hover:shadow-md hover:opacity-90 transition-all">
              {{ 'list.download' | translate }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div *ngIf="totalPages > 1" class="flex justify-center items-center gap-2 mt-12">
    <button (click)="prevPage()" [disabled]="(currentPage$ | async) === 1"
      class="p-2 rounded-full border border-gray-200 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
          clip-rule="evenodd" />
      </svg>
    </button>

    <button *ngFor="let page of pages" (click)="goToPage(page)"
      class="w-10 h-10 rounded-full font-bold text-sm transition-all" [ngClass]="
        (currentPage$ | async) === page
          ? 'bg-primary-blue text-white shadow-md'
          : 'text-gray-600 hover:bg-gray-50'
      ">
      {{ page }}
    </button>

    <button (click)="nextPage()" [disabled]="(currentPage$ | async) === totalPages"
      class="p-2 rounded-full border border-gray-200 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
          clip-rule="evenodd" />
      </svg>
    </button>
  </div>

  <!-- Empty State -->
  <div *ngIf="(resources$ | async)?.length === 0" class="text-center py-20 text-gray-400">
    <div class="text-6xl mb-4">🔍</div>
    <p class="text-lg">{{ 'list.noResults' | translate }}</p>
  </div>
</div>
