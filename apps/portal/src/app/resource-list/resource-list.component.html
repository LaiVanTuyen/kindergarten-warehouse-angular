<div class="container mx-auto px-4 py-8 font-sans">

  <div class="grid grid-cols-1 md:grid-cols-12 gap-8">

    <!-- Sidebar: Categories (3 Cols) -->
    <!-- Mobile Filter Trigger -->
    <div class="md:hidden col-span-1">
      <button (click)="toggleMobileFilter()"
        class="w-full flex items-center justify-between px-6 py-4 bg-white rounded-2xl shadow-sm border border-gray-100 font-bold text-gray-800 hover:bg-gray-50 transition-colors">
        <span class="flex items-center gap-2">
          <i class="ph ph-faders text-lg text-primary-500"></i>
          Bộ lọc & Danh mục
        </span>
        <div class="flex items-center gap-2">
          <!-- Show count helper if needed -->
          <span *ngIf="(activeCategoryName$ | async)"
            class="text-xs bg-primary-100 text-primary-600 px-2 py-0.5 rounded-full font-bold">1 Active</span>
          <i class="ph ph-caret-right text-gray-400"></i>
        </div>
      </button>
    </div>

    <!-- Sidebar: Categories (3 Cols) - Responsive Wrapper -->
    <div class="md:col-span-4 lg:col-span-3" [ngClass]="{
             'fixed inset-0 z-[60] bg-white p-6 overflow-y-auto animate-fade-in-up': isMobileFilterOpen,
             'hidden md:block': !isMobileFilterOpen
         }">

      <!-- Mobile Header -->
      <div class="flex justify-between items-center mb-6 md:hidden" *ngIf="isMobileFilterOpen">
        <h3 class="text-2xl font-black text-gray-800">Filters</h3>
        <button (click)="closeMobileFilter()"
          class="p-2 bg-gray-100 text-gray-500 hover:bg-red-50 hover:text-red-500 rounded-full transition-colors">
          <i class="ph ph-x text-xl"></i>
        </button>
      </div>

      <div class="bg-white md:rounded-3xl md:p-6 md:shadow-sm md:border md:border-gray-100 sticky top-24">
        <h4 class="font-bold text-gray-900 mb-6 flex items-center gap-2 text-xl">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-primary-500" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          Danh mục
        </h4>

        <div class="space-y-3" *ngIf="categories$ | async as categoriesRes">
          <!-- All Categories Button -->
          <button (click)="onCategoryChange('')"
            class="w-full text-left px-4 py-3.5 rounded-2xl transition-all duration-300 flex items-center justify-between group border"
            [ngClass]="(selectedCategory$ | async) === '' && (selectedTopicIds$ | async)?.length === 0
              ? 'bg-gradient-to-r from-pink-500 to-pink-600 text-white shadow-lg shadow-pink-500/30 border-transparent' 
              : 'bg-white text-gray-600 hover:bg-pink-50 hover:text-pink-600 border-gray-100 hover:border-pink-100'">
            <span class="font-bold">Tất cả</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 transition-opacity"
              [class.opacity-100]="(selectedCategory$ | async) === '' && (selectedTopicIds$ | async)?.length === 0"
              [class.opacity-0]="!((selectedCategory$ | async) === '' && (selectedTopicIds$ | async)?.length === 0)"
              fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

          <!-- Dynamic Categories -->
          <div *ngFor="let cat of categoriesRes.data" class="flex flex-col">
            <button (click)="toggleCategory(cat.id)"
              class="w-full text-left px-4 py-3.5 rounded-2xl transition-all duration-300 flex items-center justify-between group border mb-1"
              [ngClass]="(expandedCategory$ | async) === cat.id 
                  ? 'bg-pink-50 text-primary-pink font-bold border-l-4 border-l-primary-pink rounded-r-2xl rounded-l-sm' 
                  : 'bg-white text-gray-600 hover:bg-pink-50 hover:text-primary-pink border-gray-100 hover:border-pink-100'">
              <div class="flex items-center gap-3">
                <span class="text-xl">{{ cat.icon }}</span>
                <span>{{ cat.name }}</span>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform duration-200"
                [class.rotate-180]="(expandedCategory$ | async) === cat.id"
                [class.text-pink-600]="(expandedCategory$ | async) === cat.id" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <!-- Nested Topics (Accordion Body) -->
            <div *ngIf="(expandedCategory$ | async) === cat.id"
              class="ml-4 mt-2 space-y-1 pl-4 border-l-2 border-pink-100 animate-fade-in-up mb-4">
              <!-- Loading State for Topics -->
              <div *ngIf="(currentTopics$ | async)?.length === 0" class="text-xs text-gray-400 py-2 italic px-2">
                {{ 'list.noTopics' | translate }}
              </div>

              <button *ngFor="let topic of currentTopics$ | async" (click)="toggleTopic(topic.id)"
                class="w-full text-left px-4 py-2.5 text-sm rounded-xl transition-all flex items-center justify-between hover:translate-x-1"
                [ngClass]="(selectedTopicIds$ | async)?.includes(topic.id) 
                            ? 'text-sky-600 font-bold bg-sky-50' 
                            : 'text-gray-500 hover:text-sky-600 hover:bg-sky-50 hover:font-semibold'">
                <span>{{ topic.title }}</span>
                <i *ngIf="(selectedTopicIds$ | async)?.includes(topic.id)" class="ph-bold ph-check text-sky-600"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content: Resource List (9 Cols) -->
    <div class="md:col-span-8 lg:col-span-9">

      <!-- Breadcrumbs -->
      <nav class="flex text-sm text-gray-500 mb-4" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-3">
          <li *ngFor="let item of breadcrumb$ | async; let last = last" class="inline-flex items-center">
            <span *ngIf="!last" class="inline-flex items-center hover:text-gray-900 cursor-pointer">
              {{ item }}
              <svg class="w-3 h-3 text-gray-400 mx-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="m1 9 4-4-4-4" />
              </svg>
            </span>
            <span *ngIf="last" class="text-gray-400 font-medium">{{ item }}</span>
          </li>
        </ol>
      </nav>

      <!-- Section Title & Sort -->
      <div class="flex flex-col sm:flex-row justify-between items-end sm:items-center mb-8 gap-4 px-2">
        <div>
          <h2 class="text-3xl font-black text-gray-800 tracking-tight flex items-center gap-3">
            <ng-container *ngIf="(activeCategoryName$ | async) as catName; else defaultTitle">
              {{ catName }}
            </ng-container>
            <ng-template #defaultTitle>
              Khám phá tài liệu
            </ng-template>
            <span class="hidden sm:inline-block w-2 h-2 rounded-full bg-secondary-500 mb-1"></span>
          </h2>
          <p class="text-gray-400 font-medium mt-1 ml-1 text-sm">Khám phá các tài liệu tốt nhất cho bé</p>
        </div>

        <div class="relative min-w-[220px]">
          <select (change)="onSortChange($event)"
            class="w-full appearance-none bg-white border border-gray-200 text-gray-700 py-3 pl-5 pr-12 rounded-full shadow-sm focus:outline-none focus:border-secondary-500 focus:ring-4 focus:ring-secondary-500/10 cursor-pointer font-bold transition-all hover:bg-gray-50 text-sm">
            <option value="newest">Mới nhất</option>
            <option value="name-asc">Tên (A-Z)</option>
            <option value="name-desc">Tên (Z-A)</option>
            <option value="rating-desc">Đánh giá cao nhất</option>
            <option value="rating-asc">Đánh giá thấp nhất</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
            <i class="ph-bold ph-caret-down text-lg"></i>
          </div>
        </div>
      </div>

      <!-- Resource Grid & Loading State -->
      <ng-container *ngIf="{ resources: resources$ | async, isLoading: isLoading$ | async } as state">

        <!-- Loading Skeleton -->
        <ng-container *ngIf="state.isLoading">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <app-loading-skeleton type="card" [count]="6" class="contents"></app-loading-skeleton>
          </div>
        </ng-container>

        <!-- Content -->
        <ng-container *ngIf="!state.isLoading">
          <div *ngIf="state.resources && state.resources.length > 0; else empty"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div *ngFor="let resource of state.resources">
              <app-resource-card [resource]="resource" (view)="openPreview(resource)"
                (download)="downloadResource(resource)">
              </app-resource-card>
            </div>
          </div>

          <ng-template #empty>
            <div
              class="flex flex-col items-center justify-center py-20 text-center bg-white rounded-3xl border border-gray-100 shadow-sm col-span-full">
              <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-gray-400" viewBox="0 0 256 256">
                  <path
                    d="M208.57,173.19l-7.79-13.63a88.16,88.16,0,0,0-15.09-18.42c16.52-25.29,14.65-59.54-4.81-79A40.23,40.23,0,0,0,147,48c0-.65,0-1.32.06-2a8,8,0,0,0-6.19-8.48A40,40,0,0,0,92.51,57.73a40.22,40.22,0,0,0-35.63,13.1c-19.46,19.46-21.33,53.71-4.81,79a88.16,88.16,0,0,0-15.09,18.42l-7.79,13.63A40,40,0,0,0,64,240H192a40,40,0,0,0,16.57-76.81ZM99.19,65.6a24,24,0,0,1,26.4,7.85A93.47,93.47,0,0,1,107,88.72,94.27,94.27,0,0,1,88.22,70a24,24,0,0,1,11-4.43Zm-7-2.6A24,24,0,0,1,68.22,70a94.27,94.27,0,0,1-18.75,18.75,93.47,93.47,0,0,1-18.59-15.27A24,24,0,0,1,92.16,63ZM192,224H64a24,24,0,0,1-20.87-35.91l7.79-13.64A72.18,72.18,0,0,1,89.59,102h0a79.25,79.25,0,0,0,23.16,16,8,8,0,0,0,4.6,0,79.25,79.25,0,0,0,23.16-16h0a72.18,72.18,0,0,1,38.67,112.42l7.79,13.64A24,24,0,0,1,192,224ZM80,152a12,12,0,1,1,12,12A12,12,0,0,1,80,152Zm84,0a12,12,0,1,1,12,12A12,12,0,0,1,164,152Z"
                    fill="currentColor"></path>
                </svg>
              </div>
              <h3 class="text-xl font-bold text-gray-800 mb-2">Oops!</h3>
              <p class="text-gray-500 max-w-xs mx-auto mb-6">Chưa có tài liệu nào ở mục này.</p>
              <button (click)="onCategoryChange('')" class="text-pink-600 font-bold hover:underline">
                View All Resources
              </button>
            </div>
          </ng-template>
        </ng-container>
      </ng-container>

      <!-- Pagination -->
      <div *ngIf="(totalPages$ | async) as totalPages" [class.hidden]="totalPages <= 1"
        class="flex justify-center items-center gap-2 mt-12 mb-8">
        <button (click)="prevPage()" [disabled]="(currentPage$ | async) === 1"
          class="p-2.5 rounded-full border border-gray-200 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors bg-white shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
              clip-rule="evenodd" />
          </svg>
        </button>

        <ng-container *ngIf="(pages$ | async) as pages">
          <button *ngFor="let page of pages" (click)="goToPage(page)"
            class="w-10 h-10 rounded-full font-bold text-sm transition-all" [ngClass]="
                (currentPage$ | async) === page
                ? 'bg-gradient-to-r from-pink-500 to-pink-600 text-white shadow-lg shadow-pink-500/30 transform scale-105'
                : 'text-gray-600 hover:bg-pink-50 bg-white border border-gray-200'
            ">
            {{ page }}
          </button>
        </ng-container>

        <button (click)="nextPage()" [disabled]="(currentPage$ | async) === totalPages"
          class="p-2.5 rounded-full border border-gray-200 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors bg-white shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
              clip-rule="evenodd" />
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>


<!-- Mobile Backdrop -->
<div *ngIf="isMobileFilterOpen" class="fixed inset-0 bg-black/40 z-[55] backdrop-blur-sm md:hidden"
  (click)="closeMobileFilter()" (keyup.esc)="closeMobileFilter()" tabindex="0" role="button" aria-label="Close filters">
</div>
