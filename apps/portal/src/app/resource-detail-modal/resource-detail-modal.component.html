<div *ngIf="isOpen" class="fixed inset-0 z-[60] overflow-y-auto" aria-labelledby="modal-title" role="dialog"
  aria-modal="true">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-ink/60 backdrop-blur-sm transition-opacity" (click)="close()"></div>

  <!-- Panel -->
  <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
    <div
      class="relative transform overflow-hidden rounded-3xl bg-surface text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-4xl ring-1 ring-line">
      <!-- Header -->
      <div class="bg-surface-2 px-6 py-4 flex justify-between items-center border-b border-line">
        <div>
          <h3 class="text-xl font-bold text-ink" id="modal-title">
            {{ resource?.title }}
          </h3>
          <span class="text-sm text-ink-muted flex items-center mt-1">
            <span class="mr-2">{{ resource?.type }}</span>
            <span>• {{ resource?.viewsCount }} lượt xem</span>
          </span>
        </div>
        <button (click)="close()"
          class="text-ink-muted hover:text-ink focus:outline-none p-2 rounded-full hover:bg-surface-3 transition-colors">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Content (Docs Viewer or Video) -->
      <div class="px-6 py-6 h-[60vh] bg-black/5">
        <ng-container *ngIf="resource">
          <div *ngIf="resource.type === 'VIDEO'"
            class="w-full h-full rounded-xl overflow-hidden shadow-inner bg-black flex items-center justify-center">
            <!-- Mock Video Player or Iframe -->
            <iframe *ngIf="getSafeUrl(resource.fileUrl)" [src]="getSafeUrl(resource.fileUrl)" class="w-full h-full"
              frameborder="0" allowfullscreen></iframe>
            <div *ngIf="!getSafeUrl(resource.fileUrl)" class="text-white">
              Video URL invalid
            </div>
          </div>

          <div *ngIf="resource.type !== 'VIDEO'" class="w-full h-full rounded-xl overflow-hidden shadow-inner bg-surface">
            <!-- Google Docs Viewer -->
            <iframe [src]="getGoogleDocsUrl(resource.fileUrl)" class="w-full h-full" frameborder="0"></iframe>
          </div>
        </ng-container>
      </div>

      <!-- Footer / Actions -->
      <div class="bg-surface-2 px-6 py-4 flex flex-row-reverse space-x-reverse space-x-3 border-t border-line">
        <button type="button"
          class="inline-flex w-full justify-center items-center gap-2 rounded-full bg-gradient-to-r from-primary-600 to-accent-500 px-6 py-3 text-sm font-semibold text-ink-onbrand shadow-md hover:shadow-lg sm:w-auto transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2"
          (click)="download()">
          Tải xuống
        </button>
        <button type="button"
          class="mt-3 inline-flex w-full justify-center rounded-full bg-surface px-6 py-3 text-sm font-semibold text-ink shadow-sm ring-1 ring-inset ring-line hover:bg-surface-2 sm:mt-0 sm:w-auto transition-all"
          (click)="close()">
          Đóng
        </button>
      </div>
    </div>
  </div>
</div>
