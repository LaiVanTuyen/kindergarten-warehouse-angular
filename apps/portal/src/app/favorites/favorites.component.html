<div class="min-h-screen bg-surface-2 pt-24 pb-16">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-8 flex items-end justify-between flex-wrap gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-ink flex items-center gap-2">
          Tài liệu yêu thích
          <i class="ph-fill ph-heart text-red-500" aria-hidden="true"></i>
        </h1>
        <p class="mt-2 text-ink-soft">
          Danh sách các tài liệu bạn đã lưu lại để xem sau.
          <span *ngIf="totalElements() > 0" class="font-semibold text-ink-soft">
            ({{ totalElements() }} tài liệu)
          </span>
        </p>
      </div>
    </div>

    <!-- Loading -->
    <app-spinner *ngIf="loading() && resources().length === 0"
      size="lg" label="Đang tải danh sách yêu thích…" [showLabel]="true"></app-spinner>

    <!-- Error -->
    <app-error-state *ngIf="error() && !loading()"
      [message]="error()!"
      (retry)="goToPage(page())">
    </app-error-state>

    <!-- Empty -->
    <div *ngIf="isEmpty()" class="bg-surface rounded-3xl shadow-sm border border-line">
      <app-empty-state
        icon="ph ph-heart-break"
        tone="pink"
        title="Chưa có tài liệu nào"
        message="Bạn chưa lưu tài liệu nào vào danh sách yêu thích. Hãy khám phá kho tài liệu và lưu lại những gì bạn thích nhé!"
        actionLabel="Khám phá ngay"
        actionIcon="ph ph-compass"
        [actionRoute]="'/resources'">
      </app-empty-state>
    </div>

    <!-- Grid -->
    <div *ngIf="!isEmpty() && !error()"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
      [class.opacity-60]="loading()">
      <app-resource-card *ngFor="let resource of resources(); trackBy: trackById"
        [resource]="resource"
        (view)="onView(resource)"
        (download)="onDownload(resource)"></app-resource-card>
    </div>

    <div *ngIf="totalPages() > 1" class="mt-10 flex justify-center">
      <app-paginator [page]="page()" [totalPages]="totalPages()"
        (pageChange)="goToPage($event)"></app-paginator>
    </div>
  </div>
</div>
