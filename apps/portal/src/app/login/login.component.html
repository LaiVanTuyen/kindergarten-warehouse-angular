<div class="min-h-screen flex bg-white font-sans overflow-hidden">

  <!-- Left Side: Login Form -->
  <div class="w-full lg:w-1/2 flex flex-col justify-center p-8 sm:p-12 md:p-16 lg:p-24 xl:p-32 z-10 relative">

    <!-- Back to Home -->
    <a routerLink="/"
      class="absolute top-8 left-8 flex items-center gap-2 text-gray-400 hover:text-primary-500 transition-colors font-bold text-sm">
      <i class="ph ph-arrow-left text-lg"></i>
      Back to Home
    </a>

    <div class="w-full max-w-md mx-auto mt-12 lg:mt-0">
      <!-- Logo -->
      <a routerLink="/" class="inline-flex mb-12 transform hover:scale-105 transition-transform">
        <span class="text-4xl font-black text-primary-500 tracking-tight">Kinder</span>
        <span class="text-4xl font-black text-secondary-600 tracking-tight">World</span>
      </a>

      <h2 class="text-4xl font-extrabold text-gray-900 mb-4 leading-tight">
        {{ 'login.welcome' | translate }}
      </h2>
      <p class="text-lg text-gray-500 mb-10">
        {{ 'login.subtitle' | translate }}
      </p>

      <form class="space-y-6" (ngSubmit)="onSubmit()">
        <div>
          <label for="email" class="block text-sm font-bold text-gray-700 mb-2">{{ 'login.email' | translate }}</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="ph ph-envelope-simple text-gray-500 text-xl"></i>
            </div>
            <input id="email" name="email" type="text" required [(ngModel)]="email"
              class="appearance-none block w-full pl-11 pr-4 py-4 rounded-2xl bg-white border border-gray-400 focus:border-primary-pink focus:ring-4 focus:ring-primary-pink/10 text-gray-900 placeholder-gray-600 transition-all font-bold text-base hover:border-primary-pink shadow-sm"
              placeholder="Email của bạn" />
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-bold text-gray-700 mb-2">{{ 'login.password' | translate
            }}</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="ph ph-lock-key text-gray-500 text-xl"></i>
            </div>
            <input id="password" name="password" type="password" required [(ngModel)]="password"
              class="appearance-none block w-full pl-11 pr-4 py-4 rounded-2xl bg-white border border-gray-400 focus:border-primary-pink focus:ring-4 focus:ring-primary-pink/10 text-gray-900 placeholder-gray-600 transition-all font-bold text-base hover:border-primary-pink shadow-sm"
              placeholder="Mật khẩu" />
          </div>
          <!-- Forgot Password aligned to right below input -->
          <div class="flex justify-end mt-2">
            <a href="#" class="font-bold text-primary-500 hover:text-primary-600 transition-colors text-sm">
              {{ 'login.forgot' | translate }}
            </a>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" name="remember-me" type="checkbox"
              class="h-5 w-5 text-secondary-600 focus:ring-secondary-600 border-gray-300 rounded-lg cursor-pointer transition-colors" />
            <label for="remember-me" class="ml-2 block text-sm font-bold text-gray-600 cursor-pointer">
              {{ 'login.remember' | translate }}
            </label>
          </div>

          <!-- Removed Forgot (Moved up) -->
          <div class="text-sm"></div>
        </div>

        <div>
          <button type="submit" [disabled]="isLoading"
            class="w-full flex justify-center py-4 px-6 rounded-full shadow-lg text-lg font-bold text-white bg-gradient-to-r from-primary-pink to-orange-400 hover:from-pink-600 hover:to-orange-500 focus:outline-none focus:ring-4 focus:ring-pink-500/30 transition-all transform hover:-translate-y-1 active:translate-y-0 disabled:opacity-70 disabled:cursor-not-allowed">
            <span *ngIf="!isLoading">{{ 'login.signin' | translate }}</span>
            <!-- Simple text fallback if spinner removed, or keep spinner logic -->
            <div *ngIf="isLoading" class="animate-spin rounded-full h-6 w-6 border-b-2 border-white"></div>
          </button>
        </div>

        <!-- Social Login Divider -->
        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-gray-200"></div>
          <span class="flex-shrink-0 mx-4 text-gray-400 text-sm font-medium">Or continue with</span>
          <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <!-- Google Login Button -->
        <button type="button"
          class="w-full flex items-center justify-center gap-3 py-3.5 px-6 rounded-full border border-gray-300 shadow-sm bg-white hover:bg-gray-50 transition-all transform hover:-translate-y-0.5 active:translate-y-0 group">
          <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"></path>
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"></path>
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"></path>
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"></path>
          </svg>
          <span class="text-gray-600 font-bold group-hover:text-gray-800">Sign in with Google</span>
        </button>
      </form>

      <div class="mt-8 text-center text-sm text-gray-500">
        Don't have an account?
        <a routerLink="/register" class="font-bold text-secondary-600 hover:text-secondary-700 transition-colors">Sign
          up</a>
      </div>
    </div>
  </div>

  <!-- Right Side: Illustration (Full Screen) -->
  <div class="hidden lg:block w-1/2 relative overflow-hidden">
    <img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?q=80&w=2070&auto=format&fit=crop"
      alt="Kids Playing" class="absolute inset-0 w-full h-full object-cover"
      onerror="this.src='https://img.freepik.com/free-vector/kids-studying-from-home_23-2148506567.jpg'" />

    <!-- Optional text overlay / gradient over image -->
    <div
      class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent flex items-end justify-center pb-20">
      <div class="text-center text-white p-8 max-w-lg">
        <h3 class="text-3xl font-black mb-4 drop-shadow-lg">"Play is the highest form of research."</h3>
        <p class="text-lg font-medium opacity-90 drop-shadow-md">- Albert Einstein</p>
      </div>
    </div>
  </div>
</div>
