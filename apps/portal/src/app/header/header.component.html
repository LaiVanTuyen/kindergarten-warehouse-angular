<header
  class="bg-white/90 backdrop-blur-md shadow-sm border-b border-gray-100 font-sans sticky top-0 z-50 transition-all duration-300">
  <div class="container mx-auto px-4 py-3">
    <div class="flex items-center justify-between">
      <!-- Left Section: Logo + Desktop Nav -->
      <div class="flex items-center gap-4 lg:gap-12">
        <!-- Mobile Menu Button -->
        <button (click)="toggleMobileMenu()"
          class="lg:hidden p-2 text-gray-500 hover:text-primary-500 transition-colors rounded-lg hover:bg-gray-50">
          <i class="ph ph-list text-2xl"></i>
        </button>

        <!-- Logo -->
        <div
          class="flex items-center cursor-pointer select-none transition-transform hover:scale-105 active:scale-95 group opacity-100 hover:opacity-90"
          routerLink="/">
          <span class="text-2xl font-black text-primary-500 tracking-tight transition-colors">Kinder</span>
          <span class="text-2xl font-black text-secondary-600 tracking-tight transition-colors">World</span>
        </div>

        <!-- Desktop Navigation -->
        <nav class="hidden lg:flex items-center gap-2 text-sm font-bold text-gray-500">
          <a routerLink="/" routerLinkActive="bg-pink-50 text-primary-pink font-bold"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-4 py-2 rounded-full transition-colors flex items-center gap-2 hover:text-primary-pink">
            <i class="ph ph-house text-lg mb-0.5"></i>
            Trang chủ
          </a>

          <a routerLink="/resources" routerLinkActive="bg-pink-50 text-primary-pink font-bold"
            class="px-4 py-2 rounded-full transition-colors flex items-center gap-2 hover:text-primary-pink">
            <i class="ph ph-books text-lg mb-0.5"></i>
            Tài liệu
          </a>

          <a routerLink="/about" routerLinkActive="bg-pink-50 text-primary-pink font-bold"
            class="px-4 py-2 rounded-full transition-colors flex items-center gap-2 hover:text-primary-pink">
            <i class="ph ph-info text-lg mb-0.5"></i>
            Về chúng tôi
          </a>
        </nav>
      </div>

      <!-- Right Section: Search, Favorites, Lang, Login -->
      <div class="flex items-center gap-2 md:gap-4">

        <!-- Search Bar (Hidden on small mobile, maybe toggle or icon only? For now showing constrained) -->
        <div class="hidden md:block w-48 lg:w-64 relative group">
          <button
            class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 hover:text-primary-500 transition-colors z-10 cursor-pointer">
            <i class="ph ph-magnifying-glass text-xl"></i>
          </button>
          <input type="text" [value]="searchQuery" (input)="onSearchInput($any($event.target).value)"
            placeholder="Tìm kiếm..."
            class="w-full pl-10 pr-8 py-2 rounded-full border border-gray-200 bg-gray-50/50 focus:bg-white focus:outline-none focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 transition-all text-sm font-medium text-gray-700 placeholder-gray-400" />

          <!-- Clear Button -->
          <button *ngIf="searchQuery" (click)="clearSearch()"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-red-500 transition-colors z-10">
            <i class="ph ph-x-circle-fill text-lg"></i>
          </button>
        </div>

        <!-- Favorites Icon -->
        <button
          class="hidden md:flex items-center justify-center w-10 h-10 rounded-full bg-gray-50 text-gray-400 hover:bg-primary-50 hover:text-primary-500 transition-all active:scale-95 relative"
          routerLink="/favorites"> <!-- Assuming /favorites route or just visual for now -->
          <i class="ph" [ngClass]="hasFavorites ? 'ph-heart-fill text-primary-500' : 'ph-heart'"></i>
          <span *ngIf="hasFavorites"
            class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
        </button>

        <!-- Language Switcher -->
        <div class="hidden sm:flex items-center space-x-1 bg-gray-100 rounded-full p-1"
          *ngIf="translationService.currentLang$ | async as currentLang">
          <button (click)="setLang('en')" [class.bg-white]="currentLang === 'en'"
            [class.shadow-sm]="currentLang === 'en'" [class.text-primary-500]="currentLang === 'en'"
            [class.text-gray-400]="currentLang !== 'en'"
            class="px-3 py-1 rounded-full text-xs font-bold transition-all duration-200">
            EN
          </button>
          <button (click)="setLang('vi')" [class.bg-white]="currentLang === 'vi'"
            [class.shadow-sm]="currentLang === 'vi'" [class.text-primary-500]="currentLang === 'vi'"
            [class.text-gray-400]="currentLang !== 'vi'"
            class="px-3 py-1 rounded-full text-xs font-bold transition-all duration-200">
            VN
          </button>
        </div>

        <!-- User Profile / Login -->
        <!-- User Profile / Login -->
        <ng-container *ngIf="isLoggedIn">
          <div class="relative">
            <button (click)="toggleUserMenu()"
              class="flex items-center gap-2 focus:outline-none group transition-all p-1 pr-3 rounded-full hover:bg-gray-50 border border-transparent hover:border-gray-100">
              <!-- Avatar -->
              <div class="relative w-10 h-10 rounded-full border-2 border-white shadow-md overflow-hidden">
                <img *ngIf="userAvatar" [src]="userAvatar" alt="Avatar" class="w-full h-full object-cover">
                <div *ngIf="!userAvatar"
                  class="w-full h-full bg-secondary-600 flex items-center justify-center text-white text-sm font-bold">
                  {{ userInitials }}
                </div>
              </div>

              <!-- Name & Chevron (Hidden on small mobile) -->
              <div class="hidden md:flex flex-col items-start gap-0.5 text-left">
                <span class="text-xs text-gray-400 font-bold leading-none">Xin chào</span>
                <span class="text-sm text-gray-700 font-bold leading-none max-w-[100px] truncate">{{ userName }}</span>
              </div>
              <i
                class="ph ph-caret-down text-gray-400 group-hover:text-primary-500 transition-colors hidden md:block"></i>
            </button>

            <!-- Dropdown Menu -->
            <div *ngIf="isUserMenuOpen"
              class="absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-xl border border-gray-100 animate-fade-in-up z-50 overflow-hidden ring-1 ring-black ring-opacity-5">

              <!-- User Info Section -->
              <div class="px-4 py-3 border-b border-gray-100 bg-gray-50/50">
                <p class="text-sm font-bold text-gray-900 truncate">{{ userName }}</p>
                <p class="text-xs text-gray-500">Xem hồ sơ</p>
              </div>

              <!-- Menu Items -->
              <div class="py-1">
                <a routerLink="/profile" (click)="closeUserMenu()"
                  class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 hover:text-primary-600 transition-colors cursor-pointer">
                  <i class="ph ph-user text-lg"></i>
                  Hồ sơ của tôi
                </a>
                <a routerLink="/favorites" (click)="closeUserMenu()"
                  class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 hover:text-primary-600 transition-colors cursor-pointer">
                  <i class="ph ph-heart text-lg"></i>
                  Yêu thích
                </a>
                <a routerLink="/settings" (click)="closeUserMenu()"
                  class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 hover:text-primary-600 transition-colors cursor-pointer">
                  <i class="ph ph-gear text-lg"></i>
                  Cài đặt
                </a>
                <div class="border-t border-gray-50 my-1"></div>
                <button (click)="logout()"
                  class="w-full text-left flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors font-bold">
                  <i class="ph ph-sign-out text-lg"></i>
                  Đăng xuất
                </button>
              </div>
            </div>
          </div>
        </ng-container>

        <a *ngIf="!isLoggedIn" routerLink="/login"
          class="hidden sm:flex items-center px-6 py-2.5 rounded-full bg-gradient-to-r from-primary-pink to-secondary-600 text-white text-sm font-bold shadow-md hover:shadow-lg hover:from-pink-600 hover:to-secondary-700 transition-all transform hover:-translate-y-0.5 active:translate-y-0 border-transparent">
          Đăng nhập
        </a>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div *ngIf="isMobileMenuOpen"
    class="lg:hidden absolute top-full left-0 w-full bg-white shadow-xl border-t border-gray-100 animate-fade-in-up origin-top">
    <div class="p-4 space-y-4">
      <!-- Mobile Search -->
      <div class="relative w-full">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
          <i class="ph ph-magnifying-glass text-xl"></i>
        </span>
        <input type="text" [value]="searchQuery" (input)="onSearchInput($any($event.target).value)"
          placeholder="Tìm kiếm..."
          class="w-full pl-10 pr-8 py-2.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 transition-all font-medium" />
        <button *ngIf="searchQuery" (click)="clearSearch()"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-red-500">
          <i class="ph ph-x-circle-fill text-lg"></i>
        </button>
      </div>

      <nav class="flex flex-col space-y-2">
        <a routerLink="/" (click)="closeMobileMenu()" routerLinkActive="bg-primary-50 text-primary-500"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 font-bold hover:bg-gray-50 transition-colors">
          <i class="ph ph-house text-xl"></i>
          Trang chủ
        </a>
        <a routerLink="/resources" (click)="closeMobileMenu()" routerLinkActive="bg-primary-50 text-primary-500"
          class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 font-bold hover:bg-gray-50 transition-colors">
          <i class="ph ph-books text-xl"></i>
          Tài liệu
        </a>
        <a routerLink="/about" (click)="closeMobileMenu()" routerLinkActive="bg-primary-50 text-primary-500"
          class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 font-bold hover:bg-gray-50 transition-colors">
          <i class="ph ph-info text-xl"></i>
          Về chúng tôi
        </a>
        <a routerLink="/favorites" (click)="closeMobileMenu()" routerLinkActive="bg-primary-50 text-primary-500"
          class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 font-bold hover:bg-gray-50 transition-colors">
          <i class="ph ph-heart text-xl"></i>
          Yêu thích
        </a>
      </nav>

      <div class="pt-4 border-t border-gray-100 flex items-center justify-between">
        <div class="flex items-center space-x-1 bg-gray-100 rounded-lg p-1">
          <button (click)="setLang('en')" [class.bg-white]="(translationService.currentLang$ | async) === 'en'"
            class="px-3 py-1.5 rounded-md text-xs font-bold transition-all">EN</button>
          <button (click)="setLang('vi')" [class.bg-white]="(translationService.currentLang$ | async) === 'vi'"
            class="px-3 py-1.5 rounded-md text-xs font-bold transition-all">VN</button>
        </div>
        <a routerLink="/login" (click)="closeMobileMenu()"
          class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-primary-pink to-secondary-600 text-white text-sm font-bold shadow-sm">
          Đăng nhập
        </a>
      </div>
    </div>
  </div>
</header>
