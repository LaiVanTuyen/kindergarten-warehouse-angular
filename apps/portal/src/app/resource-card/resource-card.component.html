<div [routerLink]="['/resources', resource.slug || resource.id]"
    class="group bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-xl transition-all duration-300 hover:-translate-y-1 flex flex-col h-full animate-fade-in-up cursor-pointer relative z-0">

    <!-- ===== THUMBNAIL AREA ===== -->
    <div class="relative overflow-hidden h-48 bg-gray-50">

        <!-- Case 1: Có thumbnail (hoặc auto-extract từ YouTube) -->
        <ng-container *ngIf="autoThumbnail && !hasImageError">
            <img [src]="autoThumbnail" (error)="onImageError()" loading="lazy"
                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                alt="{{ resource.title }}" />

            <!-- Overlay nút Play cho video -->
            <div *ngIf="rType === 'VIDEO'"
                class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/30 transition-colors duration-300">
                <div class="w-14 h-14 rounded-full bg-red-600 shadow-lg shadow-red-500/40 flex items-center justify-center hover:scale-110 transition-transform duration-300 group-hover:bg-red-500">
                    <i class="ph-fill ph-play text-2xl text-white ml-0.5"></i>
                </div>
            </div>
        </ng-container>

        <!-- Case 2: Không có thumbnail → placeholder màu + icon lớn -->
        <div *ngIf="!autoThumbnail || hasImageError"
            class="w-full h-full flex items-center justify-center transition-transform duration-500 group-hover:scale-105"
            [ngClass]="{
                'bg-purple-100':  rType === 'VIDEO',
                'bg-rose-100':    rType === 'PDF',
                'bg-blue-100':    rType === 'DOCUMENT',
                'bg-emerald-100': rType === 'EXCEL',
                'bg-orange-100':  rType === 'POWERPOINT',
                'bg-indigo-100':  rType === 'IMAGE',
                'bg-violet-100':  rType === 'AUDIO',
                'bg-gray-100':    rType === 'OTHER'
            }">
            <i *ngIf="rType === 'VIDEO'"      class="ph-fill ph-play-circle text-7xl text-purple-400 drop-shadow-md"></i>
            <i *ngIf="rType === 'PDF'"        class="ph-fill ph-file-pdf text-7xl text-rose-400 drop-shadow-md"></i>
            <i *ngIf="rType === 'DOCUMENT'"   class="ph-fill ph-file-doc text-7xl text-blue-400 drop-shadow-md"></i>
            <i *ngIf="rType === 'EXCEL'"      class="ph-fill ph-file-xls text-7xl text-emerald-400 drop-shadow-md"></i>
            <i *ngIf="rType === 'POWERPOINT'" class="ph-fill ph-presentation text-7xl text-orange-400 drop-shadow-md"></i>
            <i *ngIf="rType === 'IMAGE'"      class="ph-fill ph-image text-7xl text-indigo-400 drop-shadow-md"></i>
            <i *ngIf="rType === 'AUDIO'"      class="ph-fill ph-music-notes text-7xl text-violet-400 drop-shadow-md"></i>
            <i *ngIf="rType === 'OTHER'"      class="ph-fill ph-file text-7xl text-gray-300 drop-shadow-md"></i>
        </div>

        <!-- Nút Yêu thích (góc trên trái) -->
        <div class="absolute top-3 left-3">
            <button (click)="toggleFavorite($event)"
                class="w-8 h-8 rounded-full bg-white/80 backdrop-blur-sm shadow-md flex items-center justify-center transition-transform hover:scale-110 active:scale-95 group/heart">
                <i class="text-xl transition-colors"
                    [ngClass]="isFavorite ? 'ph-fill ph-heart text-red-500' : 'ph ph-heart text-gray-400 group-hover/heart:text-red-400'"></i>
            </button>
        </div>

        <!-- Badge trạng thái Chờ duyệt / Bị từ chối (góc trên phải) -->
        <div class="absolute top-3 right-3 flex flex-col gap-1 items-end z-10"
            *ngIf="resource.status === 'PENDING' || resource.status === 'REJECTED'">
            <span *ngIf="resource.status === 'PENDING'"
                class="px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-amber-700 bg-amber-100/90 backdrop-blur-sm shadow-sm rounded-md border border-amber-200">
                <i class="ph-bold ph-hourglass-high mr-1"></i> Chờ duyệt
            </span>
            <span *ngIf="resource.status === 'REJECTED'"
                class="px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-rose-700 bg-rose-100/90 backdrop-blur-sm shadow-sm rounded-md border border-rose-200">
                <i class="ph-bold ph-warning-circle mr-1"></i> Bị từ chối
            </span>
        </div>
    </div>

    <!-- ===== NỘI DUNG CARD ===== -->
    <div class="p-4 flex-1 flex flex-col">
        <h3 class="font-extrabold text-gray-900 text-[1.05rem] mb-1 line-clamp-2 group-hover:text-primary-pink transition-colors leading-snug">
            {{ resource.title }}
        </h3>
        <p class="text-sm text-gray-500 mb-4 line-clamp-2 flex-1">
            {{ resource.description || 'Chưa có mô tả.' }}
        </p>

        <!-- Sao đánh giá -->
        <div class="flex items-center gap-1 mb-3"
            *ngIf="(resource.averageRating || resource.rating || 0) > 0">
            <span class="font-bold text-gray-700 text-xs leading-none">{{ resource.averageRating || resource.rating }}</span>
            <ng-container *ngFor="let star of starTemplate">
                <i *ngIf="(resource.averageRating || resource.rating || 0) >= star"
                    class="ph-fill ph-star text-yellow-400 text-sm"></i>
                <i *ngIf="(resource.averageRating || resource.rating || 0) < star && (resource.averageRating || resource.rating || 0) > (star - 1)"
                    class="ph-fill ph-star-half text-yellow-400 text-sm"></i>
                <i *ngIf="(resource.averageRating || resource.rating || 0) <= (star - 1)"
                    class="ph ph-star text-gray-300 text-sm"></i>
            </ng-container>
        </div>

        <!-- ===== FOOTER: LượtXem | LoạiTài liệu | Nút ===== -->
        <div class="flex justify-between items-center mt-auto pt-3 border-t border-gray-100">

            <!-- Lượt xem + Loại tài liệu -->
            <div class="flex items-center gap-3 text-gray-400 text-xs font-medium">
                <span class="flex items-center gap-1">
                    <i class="ph ph-eye text-base"></i>
                    <span>{{ resource.viewsCount }}</span>
                </span>

                <!-- Loại tài liệu: YouTube → icon màu đỏ + label plain, các loại khác → icon + badge pill -->
                <span class="flex items-center gap-1 pl-3 border-l border-gray-200">
                    <!-- YouTube -->
                    <ng-container *ngIf="resource.resourceType === 'YOUTUBE'">
                        <i class="ph-fill ph-youtube-logo text-lg text-[#FF0000]"></i>
                        <span class="text-xs font-semibold text-gray-600">{{ displayType }}</span>
                    </ng-container>

                    <!-- Các loại file khác -->
                    <ng-container *ngIf="resource.resourceType !== 'YOUTUBE'">
                        <i *ngIf="rType === 'VIDEO'"      class="ph-fill ph-video text-base text-rose-500"></i>
                        <i *ngIf="rType === 'PDF'"        class="ph-fill ph-file-pdf text-base text-rose-500"></i>
                        <i *ngIf="rType === 'DOCUMENT'"   class="ph-fill ph-file-doc text-base text-blue-500"></i>
                        <i *ngIf="rType === 'EXCEL'"      class="ph-fill ph-file-xls text-base text-emerald-500"></i>
                        <i *ngIf="rType === 'POWERPOINT'" class="ph-fill ph-presentation text-base text-amber-500"></i>
                        <i *ngIf="rType === 'IMAGE'"      class="ph-fill ph-image text-base text-indigo-500"></i>
                        <i *ngIf="rType === 'AUDIO'"      class="ph-fill ph-music-note text-base text-purple-500"></i>
                        <i *ngIf="rType === 'OTHER'"      class="ph-fill ph-file text-base text-gray-400"></i>
                        <span class="uppercase tracking-wider text-[10px] font-bold px-1.5 py-0.5 rounded border"
                            [ngClass]="badgeClass">{{ displayType }}</span>
                    </ng-container>
                </span>
            </div>

            <!-- Nút Xem + Tải -->
            <div class="flex gap-2 items-center">
                <button (click)="onView()"
                    class="px-4 py-1.5 rounded-full border border-primary-pink text-primary-pink text-xs font-bold hover:bg-primary-pink hover:text-white transition-all flex items-center gap-1">
                    <i *ngIf="rType === 'VIDEO' || rType === 'AUDIO'" class="ph-fill ph-play text-xs"></i>
                    Xem
                </button>
                <button (click)="onDownload($event)"
                    class="w-8 h-8 flex items-center justify-center rounded-full bg-pink-100 text-primary-pink hover:bg-pink-200 transition-all">
                    <i class="ph-bold ph-download-simple text-sm"></i>
                </button>
            </div>
        </div>
    </div>
</div>
