<div [routerLink]="['/resources', resource.slug || resource.id]"
    class="group bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-xl transition-all duration-300 hover:-translate-y-1 flex flex-col h-full animate-fade-in-up cursor-pointer relative z-0">
    <!-- Thumbnail -->
    <div class="aspect-w-16 aspect-h-10 bg-gray-100 relative overflow-hidden h-48">
        <!-- Enforcing h-48 container height -->

        <!-- Image with Lazy Loading & Error Handling -->
        <!-- Logic: Display ONLY if thumbnail exists AND no error -->
        <ng-container *ngIf="resource.thumbnail && !hasImageError">
            <img [src]="resource.thumbnail" (error)="onImageError()" loading="lazy"
                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                alt="{{ resource.title }} thumbnail" />

            <!-- Video Overlay (Play Button on top of Image) -->
            <div *ngIf="resource.type === 'VIDEO'"
                class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/10 transition-colors">
                <div
                    class="w-12 h-12 rounded-full bg-white/90 shadow-lg flex items-center justify-center backdrop-blur-sm">
                    <i class="ph-fill ph-play-circle text-2xl text-secondary-600 ml-1"></i>
                </div>
            </div>
        </ng-container>

        <!-- Fallback / Placeholder if no thumbnail or error -->
        <!-- Logic: Display ONLY if no thumbnail OR error occurred -->
        <!-- Fallback / Placeholder if no thumbnail or error -->
        <div *ngIf="!resource.thumbnail || hasImageError"
            class="w-full h-full flex items-center justify-center relative overflow-hidden" [ngClass]="{
                'bg-gradient-to-br from-lime-400 to-green-500': resource.type === 'VIDEO',
                'bg-gradient-to-br from-orange-400 to-amber-500': ['PDF','WORD','EXCEL'].includes(resource.type),
                'bg-gradient-to-br from-purple-400 to-fuchsia-500': resource.type === 'AUDIO',
                'bg-gradient-to-br from-rose-400 to-pink-500': resource.type === 'IMAGE',
                'bg-gradient-to-br from-blue-400 to-indigo-500': !['VIDEO','PDF','WORD','EXCEL','AUDIO','IMAGE'].includes(resource.type)
            }">

            <!-- Decorative Circles -->
            <div class="absolute -top-4 -right-4 w-24 h-24 bg-white/20 rounded-full blur-xl"></div>
            <div class="absolute -bottom-4 -left-4 w-20 h-20 bg-black/5 rounded-full blur-lg"></div>

            <!-- Icon -->
            <i *ngIf="resource.type === 'VIDEO'" class="ph-fill ph-play-circle text-6xl text-white drop-shadow-md"></i>
            <i *ngIf="['PDF','WORD','EXCEL'].includes(resource.type)"
                class="ph-fill ph-file-text text-6xl text-white drop-shadow-md"></i>
            <!-- Changed Audio Icon to Play Button Concept if needed, keeping music note but clear -->
            <i *ngIf="resource.type === 'AUDIO'" class="ph-fill ph-play-circle text-6xl text-white drop-shadow-md"></i>
            <i *ngIf="resource.type === 'IMAGE'" class="ph-fill ph-image text-6xl text-white drop-shadow-md"></i>
            <i *ngIf="!['VIDEO','PDF','WORD','EXCEL','AUDIO','IMAGE'].includes(resource.type)"
                class="ph-fill ph-file text-6xl text-white drop-shadow-md"></i>
        </div>

        <!-- Favorites Button (Micro-interaction) -->
        <div class="absolute top-3 left-3">
            <button (click)="toggleFavorite($event)"
                class="w-8 h-8 rounded-full bg-white/80 backdrop-blur-sm shadow-md flex items-center justify-center transition-transform hover:scale-110 active:scale-95 group/heart">
                <i class="text-xl transition-colors"
                    [ngClass]="isFavorite ? 'ph-fill ph-heart text-red-500' : 'ph ph-heart text-gray-400 group-hover/heart:text-red-400'"></i>
            </button>
        </div>
    </div>

    <!-- Content -->
    <div class="p-4 flex-1 flex flex-col">
        <h3
            class="font-extrabold text-gray-900 text-[1.1rem] mb-1 line-clamp-1 group-hover:text-secondary-600 transition-colors">
            {{ resource.title }}
        </h3>
        <p class="text-sm text-gray-500 mb-4 line-clamp-2 flex-1">
            {{ resource.description || 'No description available.' }}
        </p>

        <!-- Rating Stars (Two-Tag Logic: Fill vs Empty) -->
        <!-- Rating Stars (Two-Tag Logic: Fill vs Empty) -->
        <div class="flex items-center text-yellow-400 mb-3" *ngIf="(resource.rating || 0) > 0">
            <div class="flex items-center gap-1">
                <span class="font-bold text-gray-700 text-xs mt-[2px] leading-none">{{ resource.rating }}</span>
                <div class="flex gap-0.5">
                    <ng-container *ngFor="let star of starTemplate">
                        <!-- Case 1: Fill Star (Yellow) - using ph-fill ph-star -->
                        <i *ngIf="(resource.rating || 0) >= star" class="ph-fill ph-star text-yellow-400 text-base"></i>
                        <!-- Case 2: Half Star (Yellow) - using ph-fill ph-star-half -->
                        <i *ngIf="(resource.rating || 0) < star && (resource.rating || 0) > (star - 1)"
                            class="ph-fill ph-star-half text-yellow-400 text-base"></i>
                        <!-- Case 3: Empty Star (Gray) - using ph ph-star -->
                        <i *ngIf="(resource.rating || 0) <= (star - 1)" class="ph ph-star text-gray-300 text-base"></i>
                    </ng-container>
                </div>
            </div>
        </div>

        <!-- Footer: Views & Download -->
        <div class="flex justify-between items-center mt-auto pt-4 border-t border-gray-50">
            <div class="flex items-center gap-3 text-gray-400 text-xs font-medium">
                <span class="flex items-center">
                    <i class="ph ph-eye mr-1 text-lg"></i>
                    {{ resource.viewsCount }}
                </span>

                <!-- Relocated Type Info -->
                <span class="flex items-center pl-3 border-l border-gray-200 h-4">
                    <i *ngIf="resource.type === 'PDF'" class="ph-fill ph-file-pdf mr-1.5 text-base text-orange-500"></i>
                    <i *ngIf="resource.type === 'VIDEO'" class="ph-fill ph-video mr-1.5 text-base text-lime-600"></i>
                    <i *ngIf="resource.type === 'AUDIO'"
                        class="ph-fill ph-music-note mr-1.5 text-base text-purple-600"></i>
                    <i *ngIf="resource.type === 'IMAGE'" class="ph-fill ph-image mr-1.5 text-base text-rose-500"></i>
                    <i *ngIf="!['PDF','VIDEO','AUDIO','IMAGE'].includes(resource.type)"
                        class="ph-fill ph-file mr-1.5 text-base text-gray-400"></i>
                    <span
                        class="uppercase tracking-wider text-[10px] font-bold text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">{{
                        resource.type }}</span>
                </span>
            </div>

            <div class="flex gap-2">
                <button (click)="onView()"
                    class="px-5 py-2 rounded-full border border-primary-pink text-primary-pink text-sm font-bold shadow-sm hover:bg-primary-pink hover:text-white transition-all flex items-center gap-1 group/btn">
                    <ng-container *ngIf="resource.type === 'AUDIO' || resource.type === 'VIDEO'; else viewText">
                        <i class="ph-fill ph-play"></i>
                        Xem
                    </ng-container>
                    <ng-template #viewText>
                        Xem
                    </ng-template>
                </button>
                <button (click)="onDownload($event)"
                    class="w-10 h-10 flex items-center justify-center rounded-full bg-pink-100 text-primary-pink shadow-md hover:bg-pink-200 hover:shadow-lg transition-all">
                    <i class="ph-bold ph-download-simple text-lg"></i>
                </button>
            </div>
        </div>
    </div>
</div>
