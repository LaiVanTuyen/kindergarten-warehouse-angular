<div class="font-sans min-h-screen bg-transparent">

  <!-- Hero Section (Slider) -->
  <!-- Hero Section (Slider) -->
  <app-banner-slider></app-banner-slider>

  <!-- Featured Categories -->
  <div class="container mx-auto px-4 mb-16">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold text-gray-800">Khám phá danh mục</h2>
      <!-- <a routerLink="/resources" class="text-secondary-600 font-bold hover:text-primary-pink transition-colors">View All</a> -->
    </div>

    <!-- Horizontal Scrollable Categories -->
    <div class="relative group">
      <!-- Scroll Container -->
      <!-- Scroll Container -->
      <div #categoryScroll
        class="flex gap-6 overflow-x-auto scroll-smooth px-4 pb-8 pt-4 scrollbar-hide snap-x snap-mandatory w-fit mx-auto max-w-full"
        style="scrollbar-width: none; -ms-overflow-style: none;">
        <a *ngFor="let cat of categories$ | async" [routerLink]="['/resources']" [queryParams]="{ category: cat.slug }"
          class="flex-shrink-0 w-[240px] group/card flex flex-col items-center justify-start p-6 rounded-xl bg-white shadow-[0_4px_12px_rgba(0,0,0,0.05)] hover:shadow-[0_20px_40px_rgba(0,0,0,0.12)] border border-gray-100 hover:border-primary-pink transition-all duration-300 ease-out cursor-pointer snap-start hover:-translate-y-2 h-[220px]">

          <!-- Icon Container (Fixed Size for Alignment) -->
          <div
            class="h-24 w-full mb-4 flex items-center justify-center transition-transform group-hover/card:scale-110 duration-500 ease-out">
            <img [src]="cat.icon" [alt]="cat.name"
              class="max-w-[96px] max-h-[96px] w-auto h-auto object-contain drop-shadow-sm group-hover/card:drop-shadow-md transition-all duration-300 contrast-[1.05] saturate-[1.05]"
              onerror="this.src='https://img.icons8.com/fluency/96/folder-invoices--v1.png'" />
          </div>

          <!-- Category Name (Fixed Height for Alignment) -->
          <div class="h-[3.5rem] w-full flex items-center justify-center">
            <span
              class="font-bold text-gray-900 text-lg group-hover/card:text-primary-pink text-center leading-snug line-clamp-2 transition-colors duration-300 select-none">{{
              cat.name }}</span>
          </div>
        </a>
      </div>

      <!-- Navigation Arrows (Positioned Outside & Safe) -->
      <button (click)="scrollCategories('left')"
        class="hidden md:flex absolute top-1/2 -translate-y-1/2 -left-8 bg-white hover:bg-white text-gray-500 hover:text-primary-pink shadow-lg rounded-full w-12 h-12 items-center justify-center transition-all duration-200 z-30 border border-gray-100 hover:border-primary-pink/30 hover:shadow-xl">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button (click)="scrollCategories('right')"
        class="hidden md:flex absolute top-1/2 -translate-y-1/2 -right-8 bg-white hover:bg-white text-gray-500 hover:text-primary-pink shadow-lg rounded-full w-12 h-12 items-center justify-center transition-all duration-200 z-30 border border-gray-100 hover:border-primary-pink/30 hover:shadow-xl">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <!-- Latest Resources Section -->
  <div class="container mx-auto px-4 mb-16">
    <div class="flex justify-between items-end mb-8">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">{{ 'home.latest' | translate }}</h2>
        <p class="text-gray-500 mt-1">{{ 'home.subtitle' | translate }}</p>
      </div>
      <a routerLink="/resources"
        class="text-primary-pink font-bold hover:text-pink-700 transition-colors flex items-center gap-1 group">
        {{ 'home.viewAll' | translate }}
        <i class="ph ph-arrow-right font-bold group-hover:translate-x-1 transition-transform"></i>
      </a>
    </div>

    <!-- Resource Grid (Latest 4) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      <div *ngFor="let resource of latestResources$ | async">
        <app-resource-card [resource]="resource" (view)="downloadResource(resource)"
          (download)="downloadResource(resource)">
        </app-resource-card>
      </div>
    </div>
  </div>
</div>
