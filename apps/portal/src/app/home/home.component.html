<div class="font-sans min-h-screen bg-transparent">

  <!-- Hero Section (Slider) -->
  <div class="container mx-auto px-4 py-8 lg:py-12 relative cursor-grab active:cursor-grabbing select-none"
    (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()" (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)" (mousedown)="onMouseDown($event)" (mouseup)="onMouseUp($event)">
    <div *ngFor="let slide of slides; let i = index" [class.hidden]="i !== activeSlideIndex"
      class="bg-gradient-to-r {{ slide.bgFrom }} {{ slide.bgTo }} rounded-[2.5rem] p-8 lg:p-12 flex flex-col md:flex-row items-center gap-8 shadow-sm relative overflow-hidden transition-opacity duration-500 animate-fade-in-up min-h-[500px]">

      <!-- Text Content -->
      <div class="md:w-1/2 z-10 text-center md:text-left space-y-6">
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-black text-gray-800 leading-tight drop-shadow-sm min-h-[1.2em]"
          [innerHTML]="slide.title">
        </h1>
        <p
          class="text-gray-600 text-lg md:text-xl font-bold max-w-lg mx-auto md:mx-0 drop-shadow-sm bg-white/30 backdrop-blur-sm p-4 rounded-xl min-h-[5rem]">
          {{ slide.subtitle }}
        </p>
        <div class="pt-4">
          <a routerLink="/resources"
            class="inline-block px-8 py-4 bg-gradient-to-r from-primary-pink to-orange-400 text-white text-lg font-bold rounded-full shadow-lg hover:shadow-xl hover:from-pink-600 hover:to-orange-500 transition-all transform hover:-translate-y-1 animate-bounce-slow">
            {{ 'home.viewAll' | translate }}
          </a>
        </div>
      </div>

      <!-- Illustration -->
      <div class="md:w-1/2 flex justify-center z-10">
        <img [src]="slide.image" alt="Banner Illustration"
          class="rounded-3xl shadow-md w-full h-[350px] lg:h-[400px] object-cover transform rotate-2 hover:rotate-0 transition-transform duration-500"
          onerror="this.src='https://img.freepik.com/free-vector/happy-children-learning-classroom_74855-5852.jpg'" />
      </div>
    </div>

    <!-- Dots Info -->
    <div class="flex justify-center mt-4 gap-2">
      <button *ngFor="let slide of slides; let i = index" (click)="activeSlideIndex = i"
        class="w-4 h-4 rounded-full transition-colors"
        [ngClass]="i === activeSlideIndex ? 'bg-primary-pink scale-125' : 'bg-gray-300'">
      </button>
    </div>
  </div>

  <!-- Featured Categories -->
  <div class="container mx-auto px-4 mb-16">
    <div class="flex items-center justify-between mb-8">
      <h2 class="text-2xl font-bold text-gray-800">Khám phá danh mục</h2>
      <!-- <a routerLink="/resources" class="text-secondary-600 font-bold hover:text-primary-pink transition-colors">View All</a> -->
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6">
      <a *ngFor="let cat of categories" [routerLink]="['/resources']" [queryParams]="{ category: cat.id }"
        class="group flex flex-col items-center justify-center p-6 rounded-3xl bg-white border border-gray-100 shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all cursor-pointer relative overflow-hidden">
        <!-- Floating Block Background -->
        <div
          [class]="'absolute inset-0 opacity-10 transition-opacity group-hover:opacity-20 ' + cat.color.replace('text', 'bg').split(' ')[1]">
        </div>

        <div
          [class]="'w-16 h-16 rounded-full flex items-center justify-center mb-4 transition-transform group-hover:scale-110 shadow-sm z-10 ' + cat.color">
          <i [class]="'ph ' + cat.icon + ' text-3xl'"></i>
        </div>
        <span class="font-bold text-gray-800 z-10">{{ cat.name }}</span>
      </a>
    </div>
  </div>

  <!-- Latest Resources Section -->
  <div class="container mx-auto px-4 mb-16">
    <div class="flex justify-between items-end mb-8">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">{{ 'home.latest' | translate }}</h2>
        <p class="text-gray-500 mt-1">{{ 'home.subtitle' | translate }}</p>
      </div>
      <a routerLink="/resources"
        class="text-primary-pink font-bold hover:text-pink-700 transition-colors flex items-center gap-1 group">
        {{ 'home.viewAll' | translate }}
        <i class="ph ph-arrow-right font-bold group-hover:translate-x-1 transition-transform"></i>
      </a>
    </div>

    <!-- Resource Grid (Latest 4) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      <div *ngFor="let resource of latestResources$ | async">
        <app-resource-card [resource]="resource" (view)="downloadResource(resource)"
          (download)="downloadResource(resource)">
        </app-resource-card>
      </div>
    </div>
  </div>
</div>
